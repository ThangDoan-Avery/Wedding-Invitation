[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"

[[redirects]]
  from = "/Wedding_invitation_Thang"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Wedding_invitation_Thang/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wedding_invitation_thang"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wedding_invitation_thang/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Wedding_invitation_Trang"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Wedding_invitation_Trang/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wedding_invitation_trang"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wedding_invitation_trang/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Wedding_invitation_Th.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Wedding_invitation_Tr.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/guest=*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/dinner."
  to = "/dinner.html"
  status = 200
  force = true

[[redirects]]
  from = "/dinner./"
  to = "/dinner.html"
  status = 200
  force = true

[[redirects]]
  from = "/dinner.guest"
  to = "/dinner.html"
  status = 200
  force = true

[[redirects]]
  from = "/dinner.guest/"
  to = "/dinner.html"
  status = 200
  force = true

[[redirects]]
  from = "/dinner"
  to = "/dinner.html"
  status = 200
  force = true

[[redirects]]
  from = "/dinner/"
  to = "/dinner.html"
  status = 200
  force = true

[[headers]]
  for = "/*"

  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/optimized/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
